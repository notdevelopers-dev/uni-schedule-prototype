# Мінімальний конфіг nginx для прототипу «Розклад пар».
# Вміст теки site/ копіюється в /var/www/rozklad (rsync -a --delete site/ server:/var/www/rozklad/).

server {
    listen 80;
    listen [::]:80;
    server_name rozklad.example.org;

    root /var/www/rozklad;
    index index.html;
    charset utf-8;

    # Маршрути — у hash (#/my, #/rooms/…), тож сервер віддає лише реальні файли.
    location / {
        try_files $uri $uri/ =404;
    }

    # Дані: браузер щоразу перевіряє актуальність (ETag/Last-Modified -> 304),
    # тож нове data.json підхоплюється одразу після заміни файлу.
    location = /data.json {
        add_header Cache-Control "no-cache" always;
        default_type application/json;
    }

    # HTML теж ревалідуємо: після оновлення сайту користувач одразу отримає нову версію.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # JS/CSS/іконки без хешів в іменах: короткий кеш + ревалідація.
    location ~* \.(?:js|css|svg)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# Якщо сайт живе в підкаталозі існуючого server-блоку (https://example.org/rozklad/),
# достатньо location з alias — усі шляхи в сайті відносні:
#
#   location /rozklad/ {
#       alias /var/www/rozklad/;
#       index index.html;
#   }
#   location = /rozklad/data.json {
#       alias /var/www/rozklad/data.json;
#       add_header Cache-Control "no-cache" always;
#   }
